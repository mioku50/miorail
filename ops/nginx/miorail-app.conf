# Shared by the apex and www TLS server blocks in
# /etc/nginx/sites-available/miorail.
root /var/www/miorail;
index index.html;

# ---------------------------------------------------------------------------
# Compression.
#
# `gzip on` is already set in nginx.conf, but `gzip_types` there is left at its
# default — which is `text/html` and NOTHING else. So the HTML was compressed
# and every script and stylesheet went out raw: the app bundle shipped at 1.14 MB
# where it gzips to 310 KB. On a fast link that is invisible. On a 17 KB/s link,
# which is what a real user had, it is the difference between a slow page and an
# unusable one.
#
# `gzip_proxied` is deliberately left at its default (`off`), so nothing coming
# back from the API or the MCP endpoint is compressed here. /mcp streams
# Server-Sent Events with buffering already disabled; compressing that stream
# would hold bytes back to fill a buffer and stall the transport.
#
# `gzip_static on` prefers a pre-built `.gz` sitting next to the asset — the
# deploy writes those with `gzip -9`, which compresses harder than nginx can
# afford per request, and costs the server no CPU at all when it is used.
gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/javascript
    text/javascript
    text/css
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml
    text/plain
    text/xml
    application/xml;

location /api/ {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# Streamable HTTP MCP lives at the API root, outside /api. Keep the exact
# endpoint and its private sub-surface away from the SPA fallback below.
location = /mcp {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    # Streamable HTTP can return an SSE body. It must reach the client as the
    # MCP server emits it rather than being accumulated by Nginx.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Accel-Buffering "no" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location ^~ /mcp/ {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Accel-Buffering "no" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# MCP OAuth 2.1 lives at the API root, not under /api, because an MCP client
# discovers these paths from the issuer origin and RFC 8414 puts them there.
# Until this existed every one of them fell through to the SPA fallback below,
# so a client asking miorail.xyz where to authorize was handed an HTML page and
# reported a broken server. The advertised issuer and these locations are the
# same fact; changing one without the other silently breaks discovery.
location ^~ /.well-known/oauth- {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# `/authorize` is a browser surface: it renders the consent page and needs the
# wallet's own session cookie, so it must reach the API rather than the static
# bundle. The rest are the client-to-server halves of the same flow.
location ^~ /authorize {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location ^~ /token {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location ^~ /register {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location ^~ /revoke {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location = /health {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ---------------------------------------------------------------------------
# The Base App MiniApp.
#
# Phase 15.1. It ran on 127.0.0.1:3020 for months with no location pointing at
# it: the service was active, answered 200 locally, and nothing outside this
# host could reach it. Stocks and Radar shipping into it changed nothing until
# this block existed.
#
# `^~` so the prefix wins over the SPA fallback below without a regex race, and
# no trailing slash on either side so Next receives the `/app` prefix its
# `basePath` already generates. Rewriting the prefix away here would break every
# asset URL the app emits.
#
# Not a subdomain: the session cookie is per-origin, and sharing this one means
# a reader signed in on the web console is signed in here. That also keeps
# `/api/...` on the location above rather than through the app's own rewrite.
# ---------------------------------------------------------------------------
location ^~ /app {
    proxy_pass http://127.0.0.1:3020;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# The distribution manifest is looked for at the ORIGIN root, not under the
# app's prefix — so the one route `basePath` moves has to be moved back. The
# app still owns the document; only the path a host fetches it from is fixed
# here, which is why this is a proxy and not a copied file that can go stale.
location = /.well-known/farcaster.json {
    proxy_pass http://127.0.0.1:3020/app/.well-known/farcaster.json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location /assets/ {
    try_files $uri =404;

    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location / {
    try_files $uri $uri/ /index.html;

    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
}
