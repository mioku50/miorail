<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64" fill="none">
  <!-- M mark (same as miorail-mark.svg, scaled to left 64px) -->
  <!-- Left leg -->
  <path d="M 10 50 L 10 14" stroke="#3D46F2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left diagonal -->
  <path d="M 10 14 L 32 36" stroke="#3D46F2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right diagonal -->
  <path d="M 32 36 L 54 14" stroke="#3D46F2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg -->
  <path d="M 54 14 L 54 50" stroke="#3D46F2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left whiskers -->
  <line x1="10" y1="22" x2="2"  y2="18" stroke="#F27EE0" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="30" x2="1"  y2="30" stroke="#F27EE0" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="38" x2="2"  y2="42" stroke="#F27EE0" stroke-width="3" stroke-linecap="round"/>

  <!-- Right whiskers -->
  <line x1="54" y1="22" x2="62" y2="18" stroke="#F27EE0" stroke-width="3" stroke-linecap="round"/>
  <line x1="54" y1="30" x2="63" y2="30" stroke="#F27EE0" stroke-width="3" stroke-linecap="round"/>
  <line x1="54" y1="38" x2="62" y2="42" stroke="#F27EE0" stroke-width="3" stroke-linecap="round"/>

  <!-- "iorail" text next to the mark, navy ink #1B1D3C -->
  <text x="70" y="44" font-family="Nunito, Inter, sans-serif" font-weight="800" font-size="30" fill="#1B1D3C">iorail</text>
</svg>
