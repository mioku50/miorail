name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege. A fork's pull request gets a read-only token anyway; saying
# so here means a future job cannot quietly widen it.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as production and docker-compose.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mioagent_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      # Every action is named by the commit it was reviewed at, with its release beside it (audit SUP-6): a
      # tag can be moved to other code, a commit cannot. These releases run on Node 24, which the runner
      # was already forcing on the older ones with a deprecation warning.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version pin here on purpose: action-setup reads `packageManager`
      # from package.json, so CI and a developer's machine cannot drift.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: if [ -f package.json ]; then if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi; else echo "No package.json found, skipping"; fi

      # minimumReleaseAge holds only where pnpm resolves, and nothing here resolves: the install above is
      # frozen, and Dependabot's security updates bypass the week by themselves ("bypassed for this
      # security update", 2026-11-13). So every version a change adds to the lockfile is dated against the
      # registry here, and one younger than a week fails the job (audit SUP-1). The way past it is a line in
      # .github/release-age-exceptions.txt, in a reviewed commit.
      - name: Lockfile versions are at least a week old
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then echo "No base commit to compare with; nothing to check."; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node --import tsx scripts/check_lockfile_release_age.ts --base "$BASE_SHA"

      - name: Typecheck
        run: if [ -f package.json ] && pnpm run | grep -q typecheck; then pnpm typecheck; else echo "No typecheck script found, skipping"; fi

      # `tsc --noEmit` and a project build do not check the same things. The
      # build has caught errors the typecheck missed more than once, and it is
      # what the deploy runs — so a pull request that passes CI without it can
      # still break the deploy.
      - name: Project build
        run: pnpm -r exec tsc -b

      # The mini app is a Next.js app, and `next build` resolves every import webpack can see, optional
      # ones included. Nothing ran it before the deploy did: on 2026-11-12 a wallet library update that
      # passed every step here stopped the production build on an optional package its new dependency
      # imports lazily.
      - name: Mini app production build
        run: pnpm --filter @mioagent/miniapp build

      - name: Lint
        run: if [ -f package.json ] && pnpm run | grep -q lint; then pnpm lint; else echo "No lint script found, skipping"; fi

      - name: Unit tests (database disabled)
        run: pnpm test:unit

      # The repositories' SQL and the migrations' constraints, tested by writing rows: each file
      # alone, in an empty database of its own on the service above. These files skip unless this
      # variable names a local Postgres, and for months nothing set it; when they were run at
      # last, six had rotted and five more skipped anyway. Here a file that skips fails the job.
      - name: Storage tests on Postgres (one empty database per file)
        env:
          MIOAGENT_MIGRATION_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pnpm test:storage

      - name: Install Chromium for frontend checks
        working-directory: artifacts/interface
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser checks (fixture wallets, no signatures)
        working-directory: artifacts/interface
        run: pnpm exec playwright test

      - name: Save frontend failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-failure
          path: artifacts/interface/test-results/
          retention-days: 7

      - name: Database integration tests (isolated URL only)
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgres://postgres:postgres@localhost:5432/mioagent_test' }}
        run: pnpm test:db
