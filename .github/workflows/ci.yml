name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege. A fork's pull request gets a read-only token anyway; saying
# so here means a future job cannot quietly widen it.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as production and docker-compose.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mioagent_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      # Every action is named by the commit it was reviewed at, with its release beside it (audit SUP-6): a
      # tag can be moved to other code, a commit cannot. These releases run on Node 24, which the runner
      # was already forcing on the older ones with a deprecation warning.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version pin here on purpose: action-setup reads `packageManager`
      # from package.json, so CI and a developer's machine cannot drift.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: if [ -f package.json ]; then if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi; else echo "No package.json found, skipping"; fi

      - name: Typecheck
        run: if [ -f package.json ] && pnpm run | grep -q typecheck; then pnpm typecheck; else echo "No typecheck script found, skipping"; fi

      # `tsc --noEmit` and a project build do not check the same things. The
      # build has caught errors the typecheck missed more than once, and it is
      # what the deploy runs — so a pull request that passes CI without it can
      # still break the deploy.
      - name: Project build
        run: pnpm -r exec tsc -b

      - name: Lint
        run: if [ -f package.json ] && pnpm run | grep -q lint; then pnpm lint; else echo "No lint script found, skipping"; fi

      - name: Unit tests (database disabled)
        run: pnpm test:unit

      - name: Install Chromium for frontend checks
        working-directory: artifacts/interface
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser checks (fixture wallets, no signatures)
        working-directory: artifacts/interface
        run: pnpm exec playwright test

      - name: Save frontend failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-failure
          path: artifacts/interface/test-results/
          retention-days: 7

      - name: Database integration tests (isolated URL only)
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgres://postgres:postgres@localhost:5432/mioagent_test' }}
        run: pnpm test:db
