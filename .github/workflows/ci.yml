name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: if [ -f package.json ]; then if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi; else echo "No package.json found, skipping"; fi

      - name: Typecheck
        run: if [ -f package.json ] && pnpm run | grep -q typecheck; then pnpm typecheck; else echo "No typecheck script found, skipping"; fi

      - name: Lint
        run: if [ -f package.json ] && pnpm run | grep -q lint; then pnpm lint; else echo "No lint script found, skipping"; fi

      - name: Setup Database
        env:
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
        run: pnpm --filter @mioagent/db run push

      - name: Test
        env:
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
        run: if [ -f package.json ] && pnpm run | grep -q test; then pnpm test; else echo "No test script found, skipping"; fi

      - name: Validate tasks
        run: if [ -f scripts/validate_tasks.js ]; then node scripts/validate_tasks.js; else echo "No validate scripts found, skipping"; fi
