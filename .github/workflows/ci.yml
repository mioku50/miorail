name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package.json ]; then
            pnpm install
          else
            echo "No package.json yet; skipping install."
          fi

      - name: Typecheck
        run: |
          if [ -f package.json ] && pnpm run | grep -q "typecheck"; then
            pnpm typecheck
          else
            echo "No typecheck script yet; skipping."
          fi

      - name: Test
        run: |
          if [ -f package.json ] && pnpm run | grep -q "test"; then
            pnpm test
          else
            echo "No test script yet; skipping."
          fi
