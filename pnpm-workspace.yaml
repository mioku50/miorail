packages:
  - 'lib/*'
  - 'artifacts/*'
  - 'scripts'

# pnpm 11-supported workspace config (also read by pnpm 10).
# Moved from the deprecated `pnpm.overrides` field in package.json.
overrides:
  '@neondatabase/serverless': 0.10.4
  # GHSA-27r3-jxmh-p828: before 2.4.0 a decompressor stayed piped after the body
  # was read. Every parser in the API also refuses compressed bodies (inflate: false).
  body-parser: 2.4.0

# Supply-chain policy: refuse to resolve any package (incl. transitive)
# published within the last 7 days. Guards against dependency-confusion and
# typosquat injections riding on freshly published versions. Keep strict —
# do not bypass via minimumReleaseAgeExclude without justification.
minimumReleaseAge: 10080 # 7 days, in minutes
# Justification: transitive linting and compat dependencies in existing lockfile published <7 days ago
minimumReleaseAgeExclude:
  - '@next/eslint-plugin-next'
  - 'caniuse-lite'
  - 'eslint-module-utils'

# Build-script approval (pnpm 11 `allowBuilds` map). Only esbuild — the
# repo's bundler (tsx/vite) — is allowed; everything else stays disallowed
# by default. Narrow allowlist, not a blanket approval.
allowBuilds:
  bufferutil: false
  esbuild: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
